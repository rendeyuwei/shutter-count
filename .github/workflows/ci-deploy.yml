name: Test and deploy

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: bash -n scripts/deploy-release.sh
      - run: node --check scripts/receive-deploy.mjs && node --check scripts/deploy-ssh.mjs

  deploy:
    needs: test
    # A merge produces a push to main. PR code never receives deploy secrets.
    # Leave disabled until the host and continuing access are explicitly set up.
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      vars.SHUTTER_DEPLOY_ENABLED == 'true'
    environment: production
    concurrency:
      group: shutter-count-production
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Ignore an obsolete run instead of rolling production backwards
        id: latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          if [[ "$latest" == "$GITHUB_SHA" ]]; then
            echo 'deploy=true' >> "$GITHUB_OUTPUT"
          else
            echo 'deploy=false' >> "$GITHUB_OUTPUT"
            echo 'A newer main commit exists; this run will not deploy.'
          fi
      - name: Deploy the tested commit
        if: steps.latest.outputs.deploy == 'true'
        env:
          DEPLOY_HOST: ${{ vars.SHUTTER_DEPLOY_HOST }}
          DEPLOY_PORT: ${{ vars.SHUTTER_DEPLOY_PORT }}
          DEPLOY_PUBLIC_URL: ${{ vars.SHUTTER_DEPLOY_PUBLIC_URL }}
          DEPLOY_SSH_KEY: ${{ secrets.SHUTTER_DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ vars.SHUTTER_DEPLOY_KNOWN_HOSTS }}
        run: node scripts/deploy-ssh.mjs
